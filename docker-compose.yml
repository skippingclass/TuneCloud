services:
  db:
    image: postgres:16-alpine
    container_name: tunecloud-db
    restart: always
    environment:
      POSTGRES_USER: tunecloud
      POSTGRES_PASSWORD: tunecloud
      POSTGRES_DB: tunecloud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tunecloud -d tunecloud"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tunecloud-api
    restart: always
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://tunecloud:tunecloud@db:5432/tunecloud
      MUSIC_DIR: /music
      PORT: 4000
      HOST: 0.0.0.0
    volumes:
      - ${MUSIC_DIR:-/home/pirkov/music}:/music:ro
      - covers_data:/app/covers
    depends_on:
      db:
        condition: service_healthy
  
  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: tunecloud-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
  covers_data:
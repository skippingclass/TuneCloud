[package]
name = "tunecloud-scanner"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
